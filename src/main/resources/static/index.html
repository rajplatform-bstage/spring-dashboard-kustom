<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spring Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 60px auto; padding: 0 20px; color: #1f2937; }
    .panel { border: 1px solid #d1d5db; border-radius: 12px; padding: 24px; }
    .status { color: #15803d; font-weight: bold; }
    code { background: #f3f4f6; padding: 3px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Spring Boot Dashboard</h1>
  <div class="panel">
    <p>Application: <strong>spring-dashboard</strong></p>
    <p>Status: <span class="status">Running</span></p>
    <p>Environment: <strong id="environment">Loading...</strong></p>
    <p>API: <code>/api/status</code></p>
    <p>Health: <code>/actuator/health</code></p>
  </div>
  <script>
    fetch('/api/status')
      .then(r => r.json())
      .then(data => document.getElementById('environment').textContent =
        new URLSearchParams(location.search).get('env') || 'Set by deployment configuration');
  </script>
</body>
</html>
