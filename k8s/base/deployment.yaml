apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-dashboard
  labels:
    app: spring-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-dashboard
  template:
    metadata:
      labels:
        app: spring-dashboard
    spec:
      containers:
        - name: spring-dashboard
          image: DOCKERHUB_USERNAME/spring-dashboard:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: spring-dashboard-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
