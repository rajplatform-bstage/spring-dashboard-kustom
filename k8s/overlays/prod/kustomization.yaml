apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
replicas:
  - name: spring-dashboard
    count: 2
images:
  - name: DOCKERHUB_USERNAME/spring-dashboard
    newName: DOCKERHUB_USERNAME/spring-dashboard
    newTag: v1
configMapGenerator:
  - name: spring-dashboard-config
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=WARN
labels:
  - pairs:
      environment: prod
      app.kubernetes.io/part-of: spring-dashboard
