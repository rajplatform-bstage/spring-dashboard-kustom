apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
replicas:
  - name: spring-dashboard
    count: 1
images:
  - name: DOCKERHUB_USERNAME/spring-dashboard
    newName: DOCKERHUB_USERNAME/spring-dashboard
    newTag: v1
configMapGenerator:
  - name: spring-dashboard-config
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=DEBUG
labels:
  - pairs:
      environment: dev
      app.kubernetes.io/part-of: spring-dashboard
