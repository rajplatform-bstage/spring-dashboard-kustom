apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa
resources:
  - ../../base
replicas:
  - name: spring-dashboard
    count: 1
images:
  - name: DOCKERHUB_USERNAME/spring-dashboard
    newName: DOCKERHUB_USERNAME/spring-dashboard
    newTag: v1
configMapGenerator:
  - name: spring-dashboard-config
    literals:
      - APP_ENV=qa
      - LOG_LEVEL=INFO
labels:
  - pairs:
      environment: qa
      app.kubernetes.io/part-of: spring-dashboard
